{% set name = "pypif" %}
{% set version = "2.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f4bea4989a66f776b046180889a71f19f84e4b3fc93102d3a3f2f859d9866531

build:
  noarch: python
  number: 1
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy 
    - six

test:
  requires:
    - python {{ python_min }}
  imports:
    - pypif    

about:
  home: http://github.com/CitrineInformatics/pypif
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 'Python toolkit for working with PIFs'

  description: |
    Python toolkit for working with PIFs
  doc_url: http://citrineinformatics.github.io/pypif
  dev_url: https://github.com/CitrineInformatics/pypif

extra:
  recipe-maintainers:
    - eddotman
    - maxhutch
    - sparadiso
    - jsomara
